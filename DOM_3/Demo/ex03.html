<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>B29 ex03</title>
</head>

<body>

	<form action="/action_page.php" method="get">

		<div class="form-group">
			<label for="email">Email</label>
			<input type="email" id="email" name="email" onchange="handChange(event)"><br><br>
		</div>

		<div class="form-group">
			<label for="password">Password</label>
			<input type="text" id="password" name="password" onchange="handChange(event)"><br><br>
		</div>

		<div class="form-group">
			<label for="gender">Gender</label>

			<select name="gender" id="gender" onchange="handChange(event)">
				<option value="male">Male</option>
				<option value="female">Female</option>
				<option value="other">Other</option>
			</select>
		</div>


		<div class="form-group">
			<label for="old">Tuổi</label>
			<input type="number" id="old" name="old" onchange="handChange(event)"><br><br>
		</div>

		<div class="form-group">
			<input type="submit" value="Submit" onclick="handleSubmit(event)">
		</div>

	</form>

	<script src="./ex03.js"></script>

</body>

</html>
